<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AE3301 · Admin Console</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--panel:#161616;--line:rgba(244,244,242,.14);--ink:#f2f0ea;--dim:#a6a19a;--acc:#f0561c;--green:#1f8a34;--red:#d43d2a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px Inter,system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
h1{font-family:'Archivo Black',Inter,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);color:#0b0b0b;border-color:#0b0b0b}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.sm{padding:6px 12px;font-size:.75rem}
input,select,textarea{width:100%;background:#0d0d0d;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs .btn.on{background:var(--acc);color:#0b0b0b;border-color:#0b0b0b}
.kv{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.kv code{flex:1;letter-spacing:.12em;color:var(--acc)}
.msg{min-height:1.4em;font-size:.85rem;margin-top:8px}
.ok{color:var(--green)}.err{color:var(--red)}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login .card{width:min(400px,94vw);text-align:center}
.hide{display:none}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1 style="font-size:2rem">AE3301</h1>
    <p class="mono" style="color:var(--dim);letter-spacing:.3em;font-size:.65rem;margin:6px 0 18px">ADMIN CONSOLE</p>
    <input id="lu" placeholder="username" autocomplete="username">
    <input id="lp" type="password" placeholder="password" autocomplete="current-password">
    <button class="btn acc" id="lgo" style="width:100%;margin-top:8px">LOGIN</button>
    <p class="msg err" id="lerr"></p>
  </div>
</div>

<div id="app" class="wrap hide">
  <div class="row" style="justify-content:space-between">
    <h1 style="font-size:1.4rem">AE3301 <span style="color:var(--acc)">ADMIN</span></h1>
    <button class="btn sm" id="out">LOG OUT</button>
  </div>
  <div class="tabs">
    <button class="btn on" data-tab="keys">🔑 KEYS</button>
    <button class="btn" data-tab="quest">🧩 QUESTIONS</button>
    <button class="btn" data-tab="users">👥 USERS</button>
  </div>

  <div id="tab-keys">
    <div class="card">
      <div class="row">
        <button class="btn" data-gen="7">+ 7 DAYS</button>
        <button class="btn" data-gen="30">+ 1 MONTH</button>
        <button class="btn" data-gen="180">+ 6 MONTHS</button>
        <button class="btn" data-gen="365">+ 1 YEAR</button>
      </div>
      <p class="msg ok" id="keymsg"></p>
    </div>
    <div class="card" id="keylist"></div>
  </div>

  <div id="tab-quest" class="hide">
    <div class="card">
      <div class="grid">
        <select id="q-topic">
          <option value="cb-computer">What Is a Computer</option><option value="cb-cpu">CPU</option>
          <option value="cb-mem">RAM & Storage</option><option value="cb-files">Files & Folders</option>
          <option value="cb-paths">Paths & Extensions</option><option value="cb-os">Operating Systems</option>
          <option value="cb-term">Terminal & Linux</option><option value="cb-git">Git & GitHub</option>
        </select>
        <select id="q-tier"><option>concept</option><option>apply</option><option>industrial</option></select>
      </div>
      <textarea id="q-q" rows="2" placeholder="Question text"></textarea>
      <input id="q-o0" placeholder="Option A — CORRECT">
      <div class="grid"><input id="q-o1" placeholder="Option B"><input id="q-o2" placeholder="Option C"></div>
      <input id="q-o3" placeholder="Option D">
      <div class="grid"><input id="q-h" placeholder="Hint"><input id="q-e" placeholder="Explanation"></div>
      <button class="btn acc" id="qgo" style="width:100%;margin-top:6px">PUBLISH TO ALL DEVICES</button>
      <p class="msg" id="qmsg"></p>
    </div>
    <div class="card" id="qlist"></div>
  </div>

  <div id="tab-users" class="hide"><div class="card" id="usertable"></div></div>
</div>

<script>
const $ = s => document.querySelector(s);
const TK = 'ae3301:admintoken';
const tok = () => localStorage.getItem(TK);
async function api(p, b, method = 'POST') {
  try {
    const r = await fetch(p, { method, headers: { 'Content-Type': 'application/json' }, body: method === 'POST' ? JSON.stringify(b) : undefined });
    return await r.json();
  } catch (e) { return { err: 'network' }; }
}
const msg = (el, t, ok) => { el.textContent = t; el.className = 'msg ' + (ok ? 'ok' : 'err'); };

/* login / logout */
$('#lgo').onclick = async () => {
  const d = await api('/api/adminlogin', { user: $('#lu').value.trim(), pw: $('#lp').value });
  if (d.token) { localStorage.setItem(TK, d.token); enter(); }
  else msg($('#lerr'), '✗ ' + (d.err || 'bad credentials'));
};
$('#out').onclick = () => { localStorage.removeItem(TK); location.reload(); };
async function enter() { $('#login').classList.add('hide'); $('#app').classList.remove('hide'); loadKeys(); }

/* tabs */
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
  ['keys', 'quest', 'users'].forEach(t => $('#tab-' + t).classList.toggle('hide', t !== b.dataset.tab));
  if (b.dataset.tab === 'keys') loadKeys();
  if (b.dataset.tab === 'quest') loadQ();
  if (b.dataset.tab === 'users') loadU();
});

/* keys */
document.querySelectorAll('[data-gen]').forEach(b => b.onclick = async () => {
  const d = await api('/api/keygen', { admin: tok(), days: +b.dataset.gen });
  if (d.key) { msg($('#keymsg'), '✔ ' + d.key + '  — saved in list below', true); loadKeys(); }
  else msg($('#keymsg'), '✗ ' + (d.err || 'failed'));
});
async function loadKeys() {
  const d = await api('/api/keylist', { admin: tok() });
  $('#keylist').innerHTML = (d.keys || []).map(k =>
    '<div class="kv"><code>' + k.key + '</code>' +
    (k.bound ? '<span class="ok mono" style="font-size:.7rem">→ ' + k.bound + '</span>' : '<span class="mono" style="color:var(--dim);font-size:.7rem">unbound</span>') +
    '<span class="mono" style="color:var(--dim);font-size:.7rem">' + (k.left > 0 ? k.left + 'd left' : 'expired') + '</span>' +
    '<button class="btn sm" data-ck="' + k.key + '">⧉</button><button class="btn sm red" data-rv="' + k.key + '">✕</button></div>'
  ).join('') || '<p class="msg">No keys yet.</p>';
  document.querySelectorAll('[data-ck]').forEach(b => b.onclick = () => navigator.clipboard && navigator.clipboard.writeText(b.dataset.ck));
  document.querySelectorAll('[data-rv]').forEach(b => b.onclick = async () => { await api('/api/keydel', { admin: tok(), key: b.dataset.rv }); loadKeys(); });
}

/* questions */
$('#qgo').onclick = async () => {
  const opts = [$('#q-o0').value, $('#q-o1').value, $('#q-o2').value, $('#q-o3').value];
  const body = { admin: tok(), topic: $('#q-topic').value, tier: $('#q-tier').value, q: $('#q-q').value, options: opts, explain: $('#q-e').value, hint: $('#q-h').value };
  if (!body.q || opts.some(o => !o)) { msg($('#qmsg'), '✗ fill question + all 4 options'); return; }
  const d = await api('/api/qadd', body);
  if (d.ok) {
    msg($('#qmsg'), '✔ published to every device', true);
    ['q-q', 'q-o0', 'q-o1', 'q-o2', 'q-o3', 'q-h', 'q-e'].forEach(i => $('#' + i).value = '');
    loadQ();
  } else msg($('#qmsg'), '✗ ' + (d.err || 'failed'));
};
async function loadQ() {
  const d = await api('/api/qlist', null, 'GET');
  $('#qlist').innerHTML = (Array.isArray(d) ? d : []).map(q =>
    '<div class="kv"><span style="flex:1">' + q.q + ' <span class="mono" style="color:var(--dim);font-size:.7rem">(' + q.tier + ' · ' + q.topic + ')</span></span>' +
    '<button class="btn sm red" data-qd="' + q.id + '">✕</button></div>'
  ).join('') || '<p class="msg">Nothing authored yet.</p>';
  document.querySelectorAll('[data-qd]').forEach(b => b.onclick = async () => { await api('/api/qdel', { admin: tok(), id: b.dataset.qd }); loadQ(); });
}

/* users */
async function loadU() {
  const d = await api('/api/board', null, 'GET');
  $('#usertable').innerHTML = '<table><tr><th>#</th><th>Name</th><th>XP</th><th>Lessons</th></tr>' +
    (Array.isArray(d) ? d : []).map((u, i) => '<tr><td>' + (i + 1) + '</td><td>' + u.name + '</td><td class="mono">' + u.xp + '</td><td class="mono">' + u.lessons + '</td></tr>').join('') + '</table>';
}

/* boot: auto-enter if a valid admin session exists */
(async () => { const t = tok(); if (t) { const d = await api('/api/qcheck', { key: t }); if (d.ok) enter(); } })();
</script>
</body>
</html>
